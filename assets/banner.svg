<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="Manuel Sabino — DevOps, AdTech Automation, Frontend">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <radialGradient id="bg" cx=".75" cy=".4" r=".9"><stop offset="0" stop-color="#2a1260"/><stop offset="1" stop-color="#06060f"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
      .rot1{transform-origin:900px 180px;animation:r 22s linear infinite}
      .rot2{transform-origin:900px 180px;animation:r 34s linear infinite reverse}
      .fl{animation:f 6s ease-in-out infinite}.fl2{animation:f 8s ease-in-out infinite reverse}
      .st circle{animation:tw 3s ease-in-out infinite}.st circle:nth-child(2n){animation-delay:1s}.st circle:nth-child(3n){animation-delay:2s}
      .h{stroke-dasharray:1400;stroke-dashoffset:1400;animation:d 3s ease forwards}
      @keyframes r{to{transform:rotate(360deg)}}
      @keyframes f{50%{transform:translateY(-14px)}}
      @keyframes tw{50%{opacity:.15}}
      @keyframes d{to{stroke-dashoffset:0}}
      @keyframes in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
      .a1{animation:in 1s .1s both}.a2{animation:in 1s .35s both}.a3{animation:in 1s .6s both}
    </style>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="200" cy="320" r="150" fill="#be185d" opacity=".35" filter="url(#blur)"/>
  <circle cx="1000" cy="60" r="160" fill="#0e7490" opacity=".4" filter="url(#blur)"/>
  <g class="st" fill="#fff">
    <circle cx="80" cy="50" r="1.6"/><circle cx="310" cy="300" r="1.4"/><circle cx="480" cy="40" r="1.8"/><circle cx="640" cy="320" r="1.4"/>
    <circle cx="720" cy="90" r="1.6"/><circle cx="1130" cy="300" r="1.8"/><circle cx="1150" cy="120" r="1.4"/><circle cx="560" cy="180" r="1.2"/><circle cx="130" cy="210" r="1.5"/>
  </g>
  <g class="fl">
    <g class="rot1" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity=".9">
      <polygon points="900,70 985,120 985,240 900,290 815,240 815,120"/>
      <polygon points="900,110 950,140 950,220 900,250 850,220 850,140" stroke="#22d3ee"/>
      <line x1="900" y1="70" x2="900" y2="290"/><line x1="815" y1="120" x2="985" y2="240"/><line x1="985" y1="120" x2="815" y2="240"/>
    </g>
    <g class="rot2" fill="none" stroke="#f472b6" stroke-width="1.2" opacity=".7">
      <ellipse cx="900" cy="180" rx="150" ry="46"/><ellipse cx="900" cy="180" rx="46" ry="150" stroke="#22d3ee"/>
    </g>
    <circle cx="900" cy="180" r="26" fill="url(#g)"/>
  </g>
  <g class="fl2" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity=".6"><rect x="1060" y="200" width="34" height="34" transform="rotate(25 1077 217)"/><rect x="700" y="60" width="22" height="22" transform="rotate(-20 711 71)" stroke="#f472b6"/></g>
  <g class="t">
    <text class="a1" x="70" y="140" font-size="22" fill="#9a9ab8" letter-spacing="6">HOLA, SOY</text>
    <text class="a2" x="66" y="228" font-size="92" font-weight="800" fill="url(#g)" letter-spacing="-3">Manuel Sabino</text>
    <text class="a3" x="70" y="282" font-size="26" fill="#e8e8f5">DevOps · AdTech Automation · Frontend</text>
  </g>
  <path class="h" d="M70 305 H 560" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
</svg>
